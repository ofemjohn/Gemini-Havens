<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2e3b"/>
      <stop offset="100%" stop-color="#243d4f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a95e"/>
      <stop offset="100%" stop-color="#d4b76a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background matching the navy from the logo -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle gold accent arc (inspired by the moon in the logo) -->
  <path d="M10 52 Q8 32 18 16" stroke="url(#gold)" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- "GH" text in the logo's serif-style font weight -->
  <text x="32" y="43" text-anchor="middle" font-family="'Playfair Display','Georgia',serif" font-weight="700" font-size="30" fill="#ffffff" letter-spacing="-1">GH</text>
  <!-- Small gold star accent (like in the logo) -->
  <circle cx="52" cy="14" r="2" fill="url(#gold)" opacity="0.7"/>
  <circle cx="48" cy="10" r="1" fill="url(#gold)" opacity="0.4"/>
</svg>